name: Deploy and Auto-SSL to EdgeOne

on:
  workflow_dispatch: # Запуск только вручную из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Deploy and Apply SSL via EdgeOne
        run: |
          npx eo-maker-deploy deploy ./dist \
            --domain info.roses-crimea.ru \
            --secret-id ${{ secrets.TENCENT_SECRET_ID }} \
            --secret-key ${{ secrets.TENCENT_SECRET_KEY }} \
            --maker-api-token ${{ secrets.EDGEONE_MAKER_API_TOKEN }}
