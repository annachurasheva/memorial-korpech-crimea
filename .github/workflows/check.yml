name: Check EdgeOne Permissions

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.5.0' # Указали вашу версию

      - name: Run Permission Check
        env:
          # Передаем секреты через переменные окружения, это надежнее
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          EDGEONE_MAKER_API_TOKEN: ${{ secrets.EDGEONE_MAKER_API_TOKEN }}
        run: |
          npx eo-maker-deploy check-permissions
